name: Build Windows Client

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "windows-client/**"
      - ".github/workflows/build-windows-client.yml"

permissions:
  contents: read

jobs:
  build-win-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows-client/MinecraftSkinRunPod.csproj

      - name: Publish Full package
        run: >
          dotnet publish windows-client/MinecraftSkinRunPod.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -o windows-client/publish/full

      - name: Publish Lite package
        run: >
          dotnet publish windows-client/MinecraftSkinRunPod.csproj
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=false
          -o windows-client/publish/lite

      - name: Upload Full package
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftSkinGenerator-Full
          path: windows-client/publish/full/**
          if-no-files-found: error
          retention-days: 30

      - name: Upload Lite package
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftSkinGenerator-Lite
          path: windows-client/publish/lite/**
          if-no-files-found: error
          retention-days: 30
